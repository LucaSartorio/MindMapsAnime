name: Cleanup temporary Orihime media release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-orihime-release.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete temp-orihime-20261008 \
            --repo "$GITHUB_REPOSITORY" \
            -y --cleanup-tag
