# AniMapVerse — INTERNAL publication state: applies publication receipts.
#
#   receipt PR merged on main ─► validate ─► apply ALL receipts or NONE
#   ─► history.json + catalog updated, receipts → publication/applied/ (audit trail)
#   ─► state committed back by the GitHub App "AniMapVerse State Bot"
#      (social-state-persist.yml, SEC-01): the apply job has a READ-ONLY token.
#
# The repository never publishes and never calls Metricool / Instagram / TikTok /
# YouTube: the external Publishing Agent does, and reports with receipts.
# No secrets besides GITHUB_TOKEN. Docs: docs/SOCIAL_ENGINE.md › Publication State
# · contract: docs/SOCIAL_PUBLISHING_CONTRACT.md
name: Social publication state

on:
  push:
    branches: [main]
    paths:
      - 'tools/social-engine/publication/pending/**'
      - 'tools/social-engine/analytics/pending/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: validate and show the transitions only (no state change, no commit)'
        type: boolean
        default: false

# One application at a time (history.json has one writer); a running one is
# never cancelled — a newer run waits, then applies whatever is pending by then.
concurrency:
  group: animapverse-social-publication-state
  cancel-in-progress: false

# Least privilege: every job is read-only; the state commit is pushed by the State Bot App in
# the `persist` job of social-state-persist.yml (environment `social-state`, main only).
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  apply:
    name: Apply publication receipts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Loop guards: the State Bot's pushes DO trigger workflows (unlike GITHUB_TOKEN), so its
    # commits carry [skip ci] (GitHub then starts nothing) + [skip social-publication], and the
    # job never reacts to the bot's own login (repository variable STATE_BOT_LOGIN) or to the
    # legacy github-actions[bot] state commits.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'github-actions[bot]' &&
       (vars.STATE_BOT_LOGIN == '' || github.actor != vars.STATE_BOT_LOGIN) &&
       !contains(github.event.head_commit.message, '[skip social-publication]'))
    outputs:
      state_artifact: ${{ steps.state-upload.outcome == 'success' && steps.state-export.outputs.name || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (= @v4)
        with:
          # The branch HEAD (not the triggering sha): a run that waited in the
          # concurrency queue must see the state committed by the previous run.
          ref: ${{ github.ref_name }}
          fetch-depth: 20
          # The token is only handed to the "Persist publication state" step.
          persist-credentials: false

      - name: Decide run mode
        id: mode
        shell: bash
        run: |
          mode=apply
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then mode=dry; fi
          # Real state changes (and commits) only on the default branch.
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then mode=dry; fi
          count=$(find tools/social-engine/publication/pending tools/social-engine/analytics/pending -maxdepth 1 -type f -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "pending=$count" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode · pending receipts: $count"
          if [ "$count" = "0" ]; then
            printf '# AniMapVerse Publication State\n\nNo pending receipts — nothing to do.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        if: steps.mode.outputs.pending != '0'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (= @v4)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.mode.outputs.pending != '0'
        run: npm ci --no-audit --no-fund

      - name: Validate publication receipts
        id: validate
        if: steps.mode.outputs.pending != '0'
        # Informative: apply re-validates and, if anything is invalid, applies
        # nothing and quarantines the invalid receipts (committed below).
        continue-on-error: true
        run: npm run social:publication:validate

      - name: Dry run (transitions only)
        id: dry
        if: steps.mode.outputs.pending != '0' && steps.mode.outputs.mode == 'dry'
        run: npm run social:publication:apply:dry

      - name: Apply publication receipts
        id: apply
        if: steps.mode.outputs.pending != '0' && steps.mode.outputs.mode == 'apply'
        continue-on-error: true
        run: npm run social:publication:apply

      # Analytics snapshots (Analyst Agent): same all-or-nothing contract; refreshes
      # performance.json + next.json (the next editorial plan).
      - name: Validate analytics snapshots
        if: steps.mode.outputs.pending != '0'
        continue-on-error: true
        run: npm run social:analytics:validate

      - name: Apply analytics snapshots
        id: analytics
        if: steps.mode.outputs.pending != '0' && steps.mode.outputs.mode == 'apply'
        continue-on-error: true
        run: npm run social:analytics:apply

      # The runner is ephemeral: history, the receipts moved out of pending/ (→ applied/ or
      # failed/), analytics and the refreshed catalog must reach main. This job has a READ-ONLY
      # token: it only exports them as a raw state bundle (exact allowlist, also when receipts
      # were rejected and quarantined); social-state-persist.yml commits them.
      - name: Export state bundle
        id: state-export
        if: always() && steps.mode.outputs.mode == 'apply' && steps.mode.outputs.pending != '0'
        run: |
          node tools/social-engine/ci/state-bundle.mjs export --repo . --base "$(git rev-parse HEAD)" \
            --profile publication --out "$RUNNER_TEMP/state-raw"
          echo "name=social-state-raw-${{ github.run_id }}-${{ github.run_attempt }}-publication" >> "$GITHUB_OUTPUT"

      - name: Upload state bundle
        id: state-upload
        if: always() && steps.state-export.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.state-export.outputs.name }}
          path: ${{ runner.temp }}/state-raw/
          if-no-files-found: error
          retention-days: 7

      - name: Fail when a receipt was rejected
        if: always() && steps.mode.outputs.pending != '0'
        shell: bash
        run: |
          if [ "${{ steps.apply.outcome }}" = "failure" ] || [ "${{ steps.analytics.outcome }}" = "failure" ] || [ "${{ steps.dry.outcome }}" = "failure" ]; then
            echo "::error::Publication receipts rejected: NOTHING was applied. Invalid receipts are in tools/social-engine/publication/failed/ (+ .error.json); see the step summary."
            exit 1
          fi
          echo "Publication state up to date."

  # State commit by the State Bot App (prepare unprivileged → persist privileged); round 2 only
  # on `conflict` (main changed one of the same files meanwhile). Nothing is ever forced.
  state:
    name: Persist state
    needs: apply
    if: always() && needs.apply.outputs.state_artifact != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/social-state-persist.yml
    with:
      profile: publication
      raw-artifact: ${{ needs.apply.outputs.state_artifact }}
      round: '1'

  state-retry:
    name: Persist state (round 2)
    needs: [apply, state]
    if: always() && needs.state.outputs.result == 'conflict'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/social-state-persist.yml
    with:
      profile: publication
      raw-artifact: ${{ needs.apply.outputs.state_artifact }}
      round: '2'

  state-check:
    name: State persisted
    needs: [apply, state, state-retry]
    if: always() && needs.apply.outputs.state_artifact != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        env:
          R1: ${{ needs.state.outputs.result }}
          J1: ${{ needs.state.result }}
          R2: ${{ needs.state-retry.outputs.result }}
          J2: ${{ needs.state-retry.result }}
          RAW: ${{ needs.apply.outputs.state_artifact }}
        run: |
          echo "round1=$J1/$R1 round2=$J2/$R2"
          ok() { [ "$1" = "success" ] && { [ "$2" = "pushed" ] || [ "$2" = "noop" ]; }; }
          if ok "$J1" "$R1" || ok "$J2" "$R2"; then echo "State persisted."; exit 0; fi
          echo "::error::The publication state was NOT saved on main (round 1: $J1/$R1, round 2: $J2/$R2). Nothing was lost: the receipts are still in publication/pending/ on main and the raw bundle $RAW stays in this run for 7 days. Fix the cause, then run 'Social state persist' (Actions → Run workflow, branch main) with profile=publication, raw-artifact=$RAW, raw-run-id=${{ github.run_id }}."
          exit 1
