name: Temporary Killua media release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-killua-release.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download rendered Killua artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/killua-artifact
          gh run download 37424904091 \
            --repo "$GITHUB_REPOSITORY" \
            --name animapverse-social-render-37424904091-1 \
            --dir /tmp/killua-artifact
          VIDEO="$(find /tmp/killua-artifact -type f -name '*.mp4' -print -quit)"
          test -n "$VIDEO"
          cp "$VIDEO" /tmp/killua-part-01.mp4

      - name: Create temporary public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete temp-killua-20261006 --repo "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create temp-killua-20261006 \
            /tmp/killua-part-01.mp4#killua-part-01.mp4 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Temporary Killua publishing asset" \
            --notes "Temporary media handoff for AniMapVerse publishing."
