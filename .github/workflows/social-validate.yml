# AniMapVerse — INTERNAL social engine: validation only (never renders, no secrets).
#
# Runs on pull requests that touch the social engine or its queue, so a PR with
# an invalid / duplicated / unrenderable queue JSON goes red before merge.
# Rendering happens only after merge (social-render.yml).
name: Social validate

on:
  pull_request:
    paths:
      - 'tools/social-engine/**'
      - '.github/workflows/social-*.yml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: social-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# `pull_request` (never `pull_request_target`): untrusted PR code runs with a
# read-only token and no secrets.
permissions:
  contents: read

jobs:
  validate:
    name: Validate social queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate social queue
        run: npm run social:validate:queue

      # Hard editorial rules (max 2 same anime in a row, never the same character
      # twice, journey parts in order with spacing) AND the growth engine is the
      # only source of truth for WHAT is queued: a new feed video must be exactly
      # catalog/next.json `request` (the agent never picks a CharacterJourney —
      # or anything else — by itself). A queue PR that breaks either is red.
      - name: Editorial rules
        run: npm run social:editorial:check:selection

      - name: Dry run (plan only)
        run: npm run social:render:queue:dry

      - name: Social engine tests
        run: npm run social:validate
