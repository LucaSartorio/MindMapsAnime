# AniMapVerse — INTERNAL social video cloud renderer.
#
#   queue JSON merged on main ─► validate ─► Remotion render (same social-engine as local)
#   ─► MP4 artifact + render-summary.json ─► state (history/queue/catalog) committed back
#      by the GitHub App "AniMapVerse State Bot" (social-state-persist.yml, SEC-01):
#      the render job itself has a READ-ONLY token and never sees the App key.
#
# Not part of the public site: no deploy, no secrets, no external API, no publishing
# (publishing is external; its state comes back through social-publication-state.yml).
# Docs: docs/SOCIAL_ENGINE.md › Cloud rendering · contract: docs/SOCIAL_AGENT_CONTRACT.md
name: Social render

on:
  push:
    # The repository's default branch (verified: `main`). Rendering happens only
    # AFTER a pull request is merged; PRs are validated by social-validate.yml.
    branches: [main]
    paths:
      - 'tools/social-engine/content/queue/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: validate and show the plan only (no video, no state change, no commit)'
        type: boolean
        default: false

# One render at a time for the whole repository; a running render is never
# cancelled (a newer run waits, then processes the queue as it is by then).
concurrency:
  group: animapverse-social-render
  cancel-in-progress: false

# Least privilege: every job is read-only; the state commit is pushed by the State Bot App in
# the `persist` job of social-state-persist.yml (environment `social-state`, main only).
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Videos rendered per run (≈ 1.5–3 min each); the rest stays queued for the next run.
  SOCIAL_RENDER_LIMIT: '12'
  # Artifact retention: also recorded in history (artifact.expiresAt) for the Publishing Agent.
  SOCIAL_ARTIFACT_RETENTION_DAYS: '30'

jobs:
  render:
    name: Render queued videos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # Loop guards: the State Bot's pushes DO trigger workflows (unlike GITHUB_TOKEN), so its
    # commits carry [skip ci] (GitHub then starts nothing) + [skip social-render], and the job
    # never reacts to the bot's own login (repository variable STATE_BOT_LOGIN, e.g.
    # animapverse-state-bot[bot]) or to the legacy github-actions[bot] state commits.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'github-actions[bot]' &&
       (vars.STATE_BOT_LOGIN == '' || github.actor != vars.STATE_BOT_LOGIN) &&
       !contains(github.event.head_commit.message, '[skip social-render]'))
    outputs:
      rendered_count: ${{ steps.report.outputs.rendered_count }}
      failed_count: ${{ steps.report.outputs.failed_count }}
      artifact_name: ${{ steps.report.outputs.artifact_name }}
      state_artifact: ${{ steps.state-upload.outcome == 'success' && steps.state-export.outputs.name || '' }}
    env:
      SOCIAL_ARTIFACT_NAME: animapverse-social-render-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (= @v4)
        with:
          # The branch HEAD (not the triggering sha): a run that waited in the
          # concurrency queue must see the state committed by the previous run.
          ref: ${{ github.ref_name }}
          fetch-depth: 20
          # The token is only handed to the "Persist social history" step.
          persist-credentials: false

      - name: Decide run mode
        id: mode
        shell: bash
        run: |
          mode=render
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then mode=dry; fi
          # Real renders (and state commits) only on the default branch.
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then mode=dry; fi
          count=$(find tools/social-engine/content/queue -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "queued=$count" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode · queued files: $count"
          if [ "$count" = "0" ]; then
            printf '# AniMapVerse Social Render\n\nThe queue is empty — nothing to do.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        if: steps.mode.outputs.queued != '0'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (= @v4)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.mode.outputs.queued != '0'
        run: npm ci --no-audit --no-fund

      # Remotion downloads Chrome Headless Shell into node_modules/.remotion/
      # (resolved from the nearest package.json; the version is pinned by the
      # installed @remotion/renderer and re-checked by Remotion itself). It is
      # restored AFTER `npm ci`, which wipes node_modules.
      - name: Restore Chrome Headless Shell cache
        id: chrome-cache
        if: steps.mode.outputs.queued != '0' && steps.mode.outputs.mode == 'render'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (= @v4)
        with:
          path: node_modules/.remotion/chrome-headless-shell
          key: remotion-chrome-headless-shell-${{ runner.os }}-${{ hashFiles('node_modules/@remotion/renderer/package.json') }}

      - name: Install Chrome Headless Shell
        if: steps.mode.outputs.queued != '0' && steps.mode.outputs.mode == 'render'
        run: npx remotion browser ensure

      # Saved right away (not in a post step): the cache survives runs that end
      # red because of a failed video.
      - name: Save Chrome Headless Shell cache
        if: steps.mode.outputs.queued != '0' && steps.mode.outputs.mode == 'render' && steps.chrome-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (= @v4)
        with:
          path: node_modules/.remotion/chrome-headless-shell
          key: ${{ steps.chrome-cache.outputs.cache-primary-key }}

      - name: Generate social catalog
        if: steps.mode.outputs.queued != '0'
        run: npm run social:catalog

      - name: Validate social queue
        id: validate
        if: steps.mode.outputs.queued != '0'
        # Informative here: invalid files don't block valid ones — the batch moves
        # them to content/failed/ with the reason, and the last step turns the run
        # red. (Pull requests are gated hard by social-validate.yml.)
        continue-on-error: true
        run: npm run social:validate:queue

      # Fail-safe: never render content that breaks the hard editorial rules
      # (blocking — the render below is skipped and the run goes red).
      - name: Editorial rules
        if: steps.mode.outputs.queued != '0'
        run: npm run social:editorial:check

      - name: Dry run (plan only)
        id: dry
        if: steps.mode.outputs.queued != '0' && steps.mode.outputs.mode == 'dry'
        run: npm run social:render:queue:dry

      - name: Render queued videos
        id: render
        if: steps.mode.outputs.queued != '0' && steps.mode.outputs.mode == 'render'
        continue-on-error: true
        timeout-minutes: 45
        run: npm run social:render:queue

      - name: Prepare render artifact
        id: report
        if: always() && steps.mode.outputs.queued != '0'
        env:
          SOCIAL_RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: npm run social:ci:report

      - name: Upload rendered videos
        # Also on partial failure: successful videos + render-summary.json are kept.
        if: always() && steps.mode.outputs.mode == 'render' && steps.report.outputs.has_summary == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (= @v4)
        with:
          name: ${{ env.SOCIAL_ARTIFACT_NAME }}
          path: tools/social-engine/.cache/artifact/
          if-no-files-found: error
          retention-days: ${{ env.SOCIAL_ARTIFACT_RETENTION_DAYS }}
          compression-level: 0

      # The runner is ephemeral: history, moved queue files (→ rendered/ failed/) and the
      # refreshed catalog must reach main, or the next run would render the same content
      # again. This job has a READ-ONLY token: it only exports them as a raw state bundle
      # (exact allowlist, also on partial failure); social-state-persist.yml commits them.
      - name: Export state bundle
        id: state-export
        if: always() && steps.mode.outputs.mode == 'render' && steps.mode.outputs.queued != '0'
        run: |
          node tools/social-engine/ci/state-bundle.mjs export --repo . --base "$(git rev-parse HEAD)" \
            --profile render --out "$RUNNER_TEMP/state-raw"
          echo "name=social-state-raw-${{ github.run_id }}-${{ github.run_attempt }}-render" >> "$GITHUB_OUTPUT"

      - name: Upload state bundle
        id: state-upload
        if: always() && steps.state-export.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.state-export.outputs.name }}
          path: ${{ runner.temp }}/state-raw/
          if-no-files-found: error
          retention-days: 7

      - name: Fail when a video failed
        if: always() && steps.mode.outputs.queued != '0'
        shell: bash
        run: |
          failed="${{ steps.report.outputs.failed_count }}"
          if [ "${{ steps.render.outcome }}" = "failure" ] || [ "${{ steps.dry.outcome }}" = "failure" ] || { [ -n "$failed" ] && [ "$failed" != "0" ]; }; then
            echo "::error::${failed:-?} item(s) failed — see the step summary; failed content is in tools/social-engine/content/failed/."
            exit 1
          fi
          echo "All good: ${{ steps.report.outputs.rendered_count }} video(s)."

  # State commit by the State Bot App (prepare unprivileged → persist privileged). Round 2 runs
  # only if main changed one of the same files between prepare and push (`conflict`): it
  # re-prepares on the newer main with the history.json merge driver. Nothing is ever forced.
  state:
    name: Persist state
    needs: render
    if: always() && needs.render.outputs.state_artifact != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/social-state-persist.yml
    with:
      profile: render
      raw-artifact: ${{ needs.render.outputs.state_artifact }}
      round: '1'
    # Environment secrets (social-state) reach a reusable workflow only with `inherit`: without it
    # the App key was empty in the persist job (incident 2026-11-11). Secrets are still referenced
    # ONLY by the jobs with `environment: social-state` in social-state-persist.yml (tested).
    secrets: inherit

  state-retry:
    name: Persist state (round 2)
    needs: [render, state]
    if: always() && needs.state.outputs.result == 'conflict'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/social-state-persist.yml
    with:
      profile: render
      raw-artifact: ${{ needs.render.outputs.state_artifact }}
      round: '2'
    # Environment secrets (social-state) reach a reusable workflow only with `inherit`: without it
    # the App key was empty in the persist job (incident 2026-11-11). Secrets are still referenced
    # ONLY by the jobs with `environment: social-state` in social-state-persist.yml (tested).
    secrets: inherit

  # Dry run (Actions → Social render → Run workflow, dry_run ✔): also checks the State Bot
  # credentials THROUGH workflow_call, exactly as the real render will use them. Nothing is pushed.
  state-credentials:
    name: State Bot credentials (dry run)
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/social-state-persist.yml
    with:
      profile: render
      check-only: true
    secrets: inherit

  state-check:
    name: State persisted
    needs: [render, state, state-retry]
    if: always() && needs.render.outputs.state_artifact != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        env:
          R1: ${{ needs.state.outputs.result }}
          J1: ${{ needs.state.result }}
          R2: ${{ needs.state-retry.outputs.result }}
          J2: ${{ needs.state-retry.result }}
          RAW: ${{ needs.render.outputs.state_artifact }}
        run: |
          echo "round1=$J1/$R1 round2=$J2/$R2"
          ok() { [ "$1" = "success" ] && { [ "$2" = "pushed" ] || [ "$2" = "noop" ]; }; }
          if ok "$J1" "$R1" || ok "$J2" "$R2"; then echo "State persisted."; exit 0; fi
          echo "::error::The render state was NOT saved on main (round 1: $J1/$R1, round 2: $J2/$R2). Nothing was lost: the raw bundle $RAW stays in this run for 7 days. Fix the cause, then run 'Social state persist' (Actions → Run workflow, branch main) with profile=render, raw-artifact=$RAW, raw-run-id=${{ github.run_id }}. Until then the queue still holds these files: do not merge new queue PRs."
          exit 1
