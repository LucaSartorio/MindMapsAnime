<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#070709" />
    <meta name="application-name" content="AniMapVerse" />
    <meta name="apple-mobile-web-app-title" content="AniMapVerse" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="author" content="Luca Sartorio" />
    <!--
      Title, description, canonical, hreflang, robots, Open Graph e JSON-LD
      NON stanno qui: sono generati per ogni rotta da `src/seo/` e iniettati
      nell'HTML statico da `scripts/prerender.ts` (e aggiornati dal client in
      navigazione SPA, tag marcati `data-seo`). Vedi docs/SEO.md.
    -->
    <title>AniMapVerse</title>
    <!--
      Banner cookie pre-renderizzato (LCP): con un consenso valido già salvato
      lo si nasconde PRIMA del primo paint. Stesse regole di readStoredConsent in
      src/store/useCookieConsent.ts (chiave, versione, 180 giorni): l'allineamento
      è verificato da scripts/test-seo.ts. Nessun dato lascia il browser.
    -->
    <script>try{var c=JSON.parse(localStorage.getItem('animeInteractiveMaps.cookieConsent')||'null'),t=c&&typeof c.timestamp==='string'?Date.parse(c.timestamp):NaN;if(c&&c.version===2&&t===t&&Date.now()-t<=15552000000)document.documentElement.setAttribute('data-cookie-consent','')}catch(e){}</script>
    <!--seo-head-->
    <!-- I font sono self-hosted (vedi src/main.tsx): nessuna richiesta a
         CDN di terze parti, nessun indirizzo IP trasmesso a Google. -->
  </head>
  <body class="bg-ink-950 text-ink-100 antialiased">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
